[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nodus-runner"
version = "0.1.0"
description = "Submit Python model workloads to remote SLURM clusters over OpenSSH."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gabriel Wamat" }]
keywords = ["slurm", "hpc", "machine-learning", "ssh", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Gabriel-Wamat/nodus"
Repository = "https://github.com/Gabriel-Wamat/nodus.git"
Issues = "https://github.com/Gabriel-Wamat/nodus/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
nodus = "cluster_model_runner.cli:main"
cluster-runner = "cluster_model_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_model_runner"]

[tool.hatch.build.targets.wheel.force-include]
"src/nodus" = "nodus"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cluster_model_runner", "nodus"]
